[project]
name = "eval-expert"
version = "0.1.0"
description = "Internal metadata evaluation workbench"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3",
  "argon2-cffi>=23.1,<26",
  "cryptography>=50,<51",
  "scikit-learn>=1.6,<2",
  "deepeval>=4,<5",
  "jsonschema>=4.23,<5",
  "croniter>=6,<7",
  "tzdata>=2026.5",
  "portalocker>=4.4.0",
  "referencing>=0.37.0",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]
