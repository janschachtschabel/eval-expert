name: Verify
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.7.13'
          python-version: '3.12'
      - run: uv sync --frozen --project backend
      - run: uv tool run --from pip-audit==2.10.1 pip-audit --path backend/.venv/lib/python3.12/site-packages
      - run: uv run --project backend ruff check backend/app backend/tests
      - run: uv run --project backend ruff format --check backend/app backend/tests
      - run: uv run pytest -q
        working-directory: backend
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
      - run: npx prettier --check src tests
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start isolated test application
        env:
          EVAL_SECRET_KEY: test-key-for-ci-only-000000000000000000000000
          EVAL_ADMIN_PASSWORD: Test-password-for-browser!
          EVAL_SECURE_COOKIE: 'false'
          EVAL_DATA_DIR: data/ci
        run: |
          uv run --project backend uvicorn app.main:create_app --factory --app-dir backend --host 127.0.0.1 --port 8117 > /tmp/eval-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8117/api/health && break; sleep 1; done
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-evidence
          path: |
            artifacts/
            frontend/test-results/
      - run: docker build -t eval-expert:ci .
