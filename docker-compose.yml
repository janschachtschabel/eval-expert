services:
  eval-expert:
    build: .
    image: eval-expert:local
    restart: unless-stopped
    env_file: .env
    environment:
      EVAL_DATA_DIR: /data
      EVAL_FRONTEND_DIR: /app/frontend
    ports:
      - "${EVAL_BIND_ADDRESS:-127.0.0.1}:${EVAL_PORT:-8080}:8000"
    volumes:
      - eval-data:/data
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  eval-data:
