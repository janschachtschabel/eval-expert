# Standalone Compose-from-URL: all build files come from the Git repository.
# Preview tag is immutable; change the ref deliberately for subsequent upgrades.
services:
  eval-expert:
    build:
      context: https://github.com/janschachtschabel/eval-expert.git#preview-2026-10-07-profile-editor
    image: eval-expert:local
    restart: unless-stopped
    environment:
      EVAL_SECRET_KEY: "${EVAL_SECRET_KEY:?Set a generated secret with at least 32 characters}"
      EVAL_ADMIN_USERNAME: "${EVAL_ADMIN_USERNAME:-admin}"
      EVAL_ADMIN_PASSWORD: "${EVAL_ADMIN_PASSWORD:?Set the initial administrator password}"
      EVAL_SECURE_COOKIE: "${EVAL_SECURE_COOKIE:-true}"
      EVAL_ALLOWED_HOSTS: "${EVAL_ALLOWED_HOSTS:-}"
      FORWARDED_ALLOW_IPS: "${FORWARDED_ALLOW_IPS:-127.0.0.1}"
      EVAL_DATA_DIR: /data
      EVAL_FRONTEND_DIR: /app/frontend
    ports:
      - "${EVAL_BIND_ADDRESS:-127.0.0.1}:${EVAL_PORT:-8080}:8000"
    volumes:
      - eval-data:/data
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  eval-data:
